seed: 7
device: cpu
dtype: float32

data:
  train_text_path: null
  val_text_path: null
  seq_len: 256
  batch_size: 4
  vocab_size: 256
  train_length: 2048
  val_length: 512

model:
  architecture: hybrid
  vocab_size: 256
  d_model: 384
  n_layers: 12
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  mixer_backend: fallback
  attention_every: 5
  max_seq_len: 1024

optim:
  lr: 0.00025
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  output_dir: outputs/hz0a-small
  max_steps: 500
  log_every: 10
  eval_every: 100
  save_every: 100
  sample_every: 100
  sample_prompt: "HATCHLING-ZERO "
  sample_tokens: 32

baseline:
  architecture: transformer
  vocab_size: 256
  d_model: 384
  n_layers: 12
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  max_seq_len: 1024
