seed: 7
device: mps
dtype: float32

data:
  train_text_path: data/hz0a_seed_train.txt
  val_text_path: data/hz0a_seed_val.txt
  seq_len: 128
  batch_size: 1
  vocab_size: 256
  train_length: 1024
  val_length: 256
  num_workers: 0
  retrieval_mix_probability: 0.05
  retrieval_num_anchors: 3
  memory_mix_probability: 0.20
  memory_task_mode: mixed

model:
  architecture: hybrid
  vocab_size: 256
  d_model: 576
  n_layers: 22
  n_heads: 18
  d_ff: 1728
  dropout: 0.1
  mixer_backend: fallback
  attention_every: 4
  max_seq_len: 1024
  scratchpad_slots: 8
  scratchpad_momentum: 0.9

optim:
  lr: 0.00008
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  output_dir: outputs/hz0b-mac-110m-scratchpad-ft
  max_steps: 425
  grad_accum_steps: 4
  log_every: 5
  eval_every: 25
  save_every: 25
  sample_every: 25
  sample_prompt: "HZ-0B "
  sample_tokens: 24
  compile: false
  compile_mode: reduce-overhead
  # Direct memory-aux loss: separate batch stream of pure memory tasks,
  # weighted at 0.5 so it nudges the scratchpad without crushing LM quality.
  memory_aux_weight: 0.5
  memory_aux_loss_mode: blend
  memory_aux_retrieval_mix_probability: 0.15
  memory_aux_memory_mix_probability: 1.0

baseline:
  architecture: transformer
  vocab_size: 256
  d_model: 576
  n_layers: 22
  n_heads: 18
  d_ff: 1728
  dropout: 0.1
  max_seq_len: 1024
