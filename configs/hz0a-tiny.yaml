seed: 7
device: cpu
dtype: float32

data:
  train_text_path: null
  val_text_path: null
  seq_len: 128
  batch_size: 8
  vocab_size: 256

model:
  vocab_size: 256
  d_model: 192
  n_layers: 8
  n_heads: 6
  d_ff: 512
  dropout: 0.1
  mixer_backend: fallback
  attention_every: 4
  max_seq_len: 512

optim:
  lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  max_steps: 200
  log_every: 10
  eval_every: 50
