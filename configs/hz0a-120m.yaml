seed: 7
device: cpu
dtype: float32

data:
  train_text_path: data/hz0a_seed_train.txt
  val_text_path: data/hz0a_seed_val.txt
  seq_len: 2048
  batch_size: 1
  vocab_size: 256
  train_length: 1024
  val_length: 256

model:
  architecture: hybrid
  vocab_size: 256
  d_model: 640
  n_layers: 24
  n_heads: 16
  d_ff: 1280
  dropout: 0.1
  mixer_backend: fallback
  attention_every: 4
  max_seq_len: 2048

optim:
  lr: 0.00025
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  output_dir: outputs/hz0a-120m
  max_steps: 100
  log_every: 5
  eval_every: 25
  save_every: 25
  sample_every: 25
  sample_prompt: "HZ-0A "
  sample_tokens: 24

baseline:
  architecture: transformer
  vocab_size: 256
  d_model: 640
  n_layers: 24
  n_heads: 16
  d_ff: 1280
  dropout: 0.1
  max_seq_len: 2048
