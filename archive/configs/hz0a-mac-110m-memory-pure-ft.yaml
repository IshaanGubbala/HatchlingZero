seed: 7
device: mps
dtype: float32

data:
  train_text_path: data/hz0a_seed_train.txt
  val_text_path: data/hz0a_seed_val.txt
  seq_len: 128
  batch_size: 1
  vocab_size: 256
  train_length: 1024
  val_length: 256
  num_workers: 0
  retrieval_mix_probability: 0.0
  retrieval_num_anchors: 3
  memory_mix_probability: 1.0

model:
  architecture: hybrid
  vocab_size: 256
  d_model: 576
  n_layers: 22
  n_heads: 18
  d_ff: 1728
  dropout: 0.1
  mixer_backend: fallback
  attention_every: 4
  max_seq_len: 1024

optim:
  lr: 0.00005
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  output_dir: outputs/hz0a-mac-110m-memory-pure-ft
  max_steps: 200
  grad_accum_steps: 4
  log_every: 5
  eval_every: 25
  save_every: 25
  sample_every: 25
  sample_prompt: "HZ-0A "
  sample_tokens: 24
  compile: false
  compile_mode: reduce-overhead

baseline:
  architecture: transformer
  vocab_size: 256
  d_model: 576
  n_layers: 22
  n_heads: 18
  d_ff: 1728
  dropout: 0.1
  max_seq_len: 1024
