seed: 7
device: cpu
dtype: float32

data:
  train_text_path: data/hz0a_seed_train.txt
  val_text_path: data/hz0a_seed_val.txt
  seq_len: 128
  batch_size: 8
  vocab_size: 256
  train_length: 1024
  val_length: 256

model:
  architecture: hybrid
  vocab_size: 256
  d_model: 192
  n_layers: 8
  n_heads: 6
  d_ff: 512
  dropout: 0.1
  mixer_backend: gdn2_ref
  attention_every: 4
  max_seq_len: 512
  residual_mode: attn_res
  attn_res_rank: 192
  attn_res_heads: 1

optim:
  lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

train:
  output_dir: outputs/hz0f-attnres-fullrank
  max_steps: 300
  log_every: 25
  eval_every: 100
  save_every: 1000000
  sample_every: 1000000
  sample_prompt: "HZ-0A "
  sample_tokens: 24
